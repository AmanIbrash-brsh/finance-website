version: '3.8'

services:
  finance-tracker:
    build: .
    container_name: finance_tracker
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
    environment:
      # Введите токен вашего Telegram-бота ниже
      - TELEGRAM_BOT_TOKEN=your_telegram_bot_token_here
      
      # Укажите адрес, по которому будет доступен сайт (нужно для создания корректных ссылок авторизации)
      # Если запускаете локально, оставьте http://localhost:5000
      - FRONTEND_URL=http://localhost:5000
      
      # Секретный ключ для подписи сессий
      - JWT_SECRET=change_me_to_something_very_secure_12345
      
      # Порт, на котором работает приложение внутри контейнера
      - PORT=5000
      
      # Путь к БД (не меняйте, так как эта папка монтируется в Volume)
      - DATABASE_PATH=/app/data/finance.db
    restart: unless-stopped
